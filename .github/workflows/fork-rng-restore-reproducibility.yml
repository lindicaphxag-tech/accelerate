name: Reproducible training RNG checkpoint restoration guard
on:
  push:
    branches: [research/checkpoint-rng-test]
    paths:
      - src/accelerate/checkpointing.py
      - src/accelerate/accelerator.py
      - tests/test_checkpoint_rng_restore_transaction.py
      - .github/workflows/fork-rng-restore-reproducibility.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-rng-corruption-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual CPU model checkpoint runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
      - name: Execute actual save-load, corrupt and missing-state tests
        run: |
          python -m pytest -q tests/test_checkpoint_rng_restore_transaction.py
